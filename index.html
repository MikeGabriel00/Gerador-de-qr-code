<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de QR Code Pro</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .container {
      background: white;
      padding: 1.5rem;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
    }
    h1 { font-size: 1.4rem; color: #1f2937; text-align: center; margin-top: 0; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 1rem;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e5e7eb;
      color: #374151;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #4b5563;
    }
    .options-grid label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    input[type="color"] { padding: 2px; height: 38px; cursor: pointer; }
    .btn-main {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-main:hover { background-color: #1d4ed8; }
    .btn-download {
      width: 100%;
      padding: 12px;
      background-color: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      margin-top: 8px;
    }
    .btn-download:hover { background-color: #15803d; }
    #resultado {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    canvas { max-width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Gerador de QR Code</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="mudarAba('texto')">Link / Texto</button>
    <button class="tab-btn" onclick="mudarAba('wifi')">Wi-Fi</button>
    <button class="tab-btn" onclick="mudarAba('whats')">WhatsApp</button>
  </div>

  <!-- Aba Texto / Link -->
  <div id="aba-texto" class="tab-content active">
    <input type="text" id="input-texto" placeholder="Cole seu link, texto ou código Pix...">
  </div>

  <!-- Aba Wi-Fi -->
  <div id="aba-wifi" class="tab-content">
    <input type="text" id="wifi-ssid" placeholder="Nome da rede Wi-Fi (SSID)">
    <input type="text" id="wifi-senha" placeholder="Senha do Wi-Fi">
    <select id="wifi-tipo">
      <option value="WPA">Segurança: WPA/WPA2 (Padrão)</option>
      <option value="WEP">Segurança: WEP</option>
      <option value="nopass">Sem senha</option>
    </select>
  </div>

  <!-- Aba WhatsApp -->
  <div id="aba-whats" class="tab-content">
    <input type="text" id="whats-num" placeholder="Número com DDD (ex: 5519999999999)">
    <input type="text" id="whats-msg" placeholder="Mensagem automática (opcional)">
  </div>

  <!-- Personalização -->
  <div class="options-grid">
    <label>Cor do Código:
      <input type="color" id="corFrente" value="#000000">
    </label>
    <label>Cor do Fundo:
      <input type="color" id="corFundo" value="#ffffff">
    </label>
    <label>Tamanho (Qualidade):
      <select id="tamanho">
        <option value="300">Normal (300px)</option>
        <option value="800">Alta (800px - Impressão)</option>
      </select>
    </label>
    <label>Logo no centro (opcional):
      <input type="file" id="logoInput" accept="image/*" style="padding: 6px; font-size: 0.8rem;">
    </label>
  </div>

  <button class="btn-main" onclick="gerarQR()">Gerar QR Code</button>
  <div id="resultado"></div>
  <div id="temp-qr" style="display:none;"></div>
  <button id="btnBaixar" class="btn-download" onclick="baixarQR()">Baixar PNG</button>
</div>

<script>
  let abaAtual = 'texto';

  function mudarAba(aba) {
    abaAtual = aba;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('aba-' + aba).classList.add('active');
  }

  function montarConteudo() {
    if (abaAtual === 'texto') {
      return document.getElementById('input-texto').value.trim();
    }
    if (abaAtual === 'wifi') {
      const ssid = document.getElementById('wifi-ssid').value.trim();
      const senha = document.getElementById('wifi-senha').value.trim();
      const tipo = document.getElementById('wifi-tipo').value;
      if (!ssid) return '';
      return `WIFI:T:${tipo};S:${ssid};P:${senha};;`;
    }
    if (abaAtual === 'whats') {
      const num = document.getElementById('whats-num').value.replace(/\D/g, '');
      const msg = encodeURIComponent(document.getElementById('whats-msg').value.trim());
      if (!num) return '';
      return `https://wa.me{num}?text=${msg}`;
    }
  }

  function gerarQR() {
    const conteudo = montarConteudo();
    if (!conteudo) {
      alert('Preencha os dados obrigatórios primeiro!');
      return;
    }

    const tamanho = parseInt(document.getElementById('tamanho').value);
    const tempDiv = document.getElementById('temp-qr');
    const resultadoDiv = document.getElementById('resultado');
    tempDiv.innerHTML = '';
    resultadoDiv.innerHTML = '';

    new QRCode(tempDiv, {
      text: conteudo,
      width: tamanho,
      height: tamanho,
      colorDark: document.getElementById('corFrente').value,
      colorLight: document.getElementById('corFundo').value,
      correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(() => {
      const qrCanvas = tempDiv.querySelector('canvas');
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = tamanho;
      finalCanvas.height = tamanho;
      const ctx = finalCanvas.getContext('2d');
      ctx.drawImage(qrCanvas, 0, 0);

      const logoFile = document.getElementById('logoInput').files[0];
      if (logoFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const logoSize = tamanho * 0.22;
            const pos = (tamanho - logoSize) / 2;
            ctx.fillStyle = document.getElementById('corFundo').value;
            ctx.fillRect(pos - 6, pos - 6, logoSize + 12, logoSize + 12);
            ctx.drawImage(img, pos, pos, logoSize, logoSize);
            resultadoDiv.appendChild(finalCanvas);
            document.getElementById('btnBaixar').style.display = 'block';
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(logoFile);
      } else {
        resultadoDiv.appendChild(finalCanvas);
        document.getElementById('btnBaixar').style.display = 'block';
      }
    }, 100);
  }

  function baixarQR() {
    const canvas = document.querySelector('#resultado canvas');
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `qrcode-${abaAtual}.png`;
    link.click();
  }
</script>

</body>
</html>
